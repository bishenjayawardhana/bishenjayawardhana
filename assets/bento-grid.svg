<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="850" height="310" fill="none">
  <defs>
    <!-- Background Cosmic Ambient Nebula -->
    <radialGradient id="bento-bg-nebula" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e2a6b" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#07173e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020817" />
    </radialGradient>

    <!-- Ultra-Premium Dark Frosted Glass Surface -->
    <linearGradient id="dark-frosted-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c204d" stop-opacity="0.82" />
      <stop offset="50%" stop-color="#071536" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#040d24" stop-opacity="0.92" />
    </linearGradient>

    <!-- Glass Luminous Border Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#1e40af" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fd91cc" stop-opacity="0.65" />
    </linearGradient>

    <!-- Center Radiant Hot Pink Card -->
    <linearGradient id="pink-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3385" />
      <stop offset="50%" stop-color="#fd6ca9" />
      <stop offset="100%" stop-color="#ff88c2" />
    </linearGradient>

    <!-- Sparkline Fill Gradient -->
    <linearGradient id="sparkline-pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4794" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff4794" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glass Pill Gradient -->
    <linearGradient id="pill-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a235c" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0d2e7a" stop-opacity="0.5" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="pink-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#ff3385" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff88c2" flood-opacity="0.4" />
    </filter>
    <filter id="glass-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.2" />
    </filter>
  </defs>

  <style>
    /* ==================== INTERACTIVE MOTION ENGINE ==================== */
    
    /* 1. Center Card Floating & Breathing Glow */
    @keyframes card-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes aura-breathe {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 18px 32px rgba(255, 51, 133, 0.7)); }
    }
    .center-card-animated {
      animation: card-float 6s ease-in-out infinite, aura-breathe 4s ease-in-out infinite;
    }

    /* 2. Speedometer Needle Dynamic Sweep */
    @keyframes needle-sweep {
      0% { transform: rotate(-35deg); }
      30% { transform: rotate(18deg); }
      55% { transform: rotate(5deg); }
      75% { transform: rotate(22deg); }
      100% { transform: rotate(-35deg); }
    }
    .needle-element {
      transform-origin: 0px 0px;
      animation: needle-sweep 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* 3. Number Counter Pulse */
    @keyframes number-pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    .number-animated {
      transform-origin: 0px -12px;
      animation: number-pulse 3.5s ease-in-out infinite;
    }

    /* 4. Chart Scrubber Pin Gliding on Wave */
    @keyframes pin-glide {
      0% { transform: translate(0px, 0px); }
      35% { transform: translate(45px, -18px); }
      65% { transform: translate(-40px, 12px); }
      100% { transform: translate(0px, 0px); }
    }
    .scrubber-animated {
      animation: pin-glide 8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* 5. Progress Bars Dynamic Respiration */
    @keyframes bar-pulse-1 {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(1.02); }
    }
    @keyframes bar-pulse-2 {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.98); }
    }
    .bar-anim-1 {
      transform-origin: 0 0;
      animation: bar-pulse-1 4s ease-in-out infinite;
    }
    .bar-anim-2 {
      transform-origin: 0 0;
      animation: bar-pulse-2 4.5s ease-in-out infinite;
    }

    /* 6. Subtle Stardust Twinkle */
    @keyframes star-twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }
    .stardust-twinkle {
      animation: star-twinkle 4s ease-in-out infinite;
    }

    /* Typography */
    .card-heading {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #ffffff;
      letter-spacing: -0.2px;
    }
    .metric-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-weight: 600;
      font-size: 10.5px;
      fill: #93c5fd;
    }
    .pink-card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 12px;
      fill: #ffffff;
      letter-spacing: 0.2px;
    }
    .gauge-number {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: -1px;
    }
  </style>

  <!-- ==================== OUTER CONTAINER WITH AMBIENT NEBULA ==================== -->
  <rect x="0.5" y="0.5" width="849" height="309" rx="18" fill="#020817" stroke="#172e59" stroke-width="1.2" />
  <rect x="1" y="1" width="848" height="308" rx="17" fill="url(#bento-bg-nebula)" />

  <!-- Celestial Stardust Specks -->
  <g class="stardust-twinkle">
    <circle cx="85" cy="40" r="1.2" fill="#ffffff" />
    <circle cx="210" cy="25" r="1.4" fill="#38bdf8" />
    <circle cx="370" cy="35" r="1" fill="#ffffff" />
    <circle cx="590" cy="30" r="1.3" fill="#fd91cc" />
    <circle cx="730" cy="45" r="1.1" fill="#ffffff" />
    <circle cx="150" cy="280" r="1" fill="#38bdf8" />
    <circle cx="710" cy="285" r="1.2" fill="#ffffff" />
    <circle cx="490" cy="295" r="1.5" fill="#fd91cc" />
  </g>

  <!-- ==================== CARD 1: ALERTS BY SCAN TYPE (LEFT - FROSTED GLASS) ==================== -->
  <g transform="translate(16, 22)" filter="url(#glass-shadow)">
    <rect width="272" height="262" rx="16" fill="url(#dark-frosted-glass)" stroke="url(#glass-border)" stroke-width="1.2" />

    <g transform="translate(18, 18)">
      <rect width="26" height="26" rx="7" fill="#0c2357" stroke="#1d4ed8" stroke-width="0.8" />
      <path d="M13 7 L18 9.5 V14 C18 17 13 19 13 19 C13 19 8 17 8 14 V9.5 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />
      <text x="36" y="18" class="card-heading">Alerts by Scan Type</text>
    </g>

    <!-- Row 1: SAST -->
    <g transform="translate(18, 64)">
      <text x="0" y="10" class="metric-sub">SAST &amp; OWASP Defense</text>
      <text x="236" y="10" class="metric-sub" text-anchor="end" font-weight="700" fill="#38bdf8">94%</text>
      <g transform="translate(0, 16)" class="bar-anim-1">
        <rect width="236" height="8" rx="4" fill="#081738" stroke="#162e63" stroke-width="0.8" />
        <rect width="160" height="8" rx="4" fill="#2563eb" />
        <rect x="163" width="58" height="8" rx="4" fill="#fd91cc" />
      </g>
    </g>

    <!-- Row 2: DAST -->
    <g transform="translate(18, 112)">
      <text x="0" y="10" class="metric-sub">DAST &amp; Network Traffic</text>
      <text x="236" y="10" class="metric-sub" text-anchor="end" font-weight="700" fill="#38bdf8">88%</text>
      <g transform="translate(0, 16)" class="bar-anim-2">
        <rect width="236" height="8" rx="4" fill="#081738" stroke="#162e63" stroke-width="0.8" />
        <rect width="130" height="8" rx="4" fill="#fd91cc" />
        <rect x="133" width="75" height="8" rx="4" fill="#38bdf8" />
      </g>
    </g>

    <!-- Row 3: API Security -->
    <g transform="translate(18, 160)">
      <text x="0" y="10" class="metric-sub">API Security &amp; OAuth 2.0</text>
      <text x="236" y="10" class="metric-sub" text-anchor="end" font-weight="700" fill="#38bdf8">96%</text>
      <g transform="translate(0, 16)" class="bar-anim-1">
        <rect width="236" height="8" rx="4" fill="#081738" stroke="#162e63" stroke-width="0.8" />
        <rect width="185" height="8" rx="4" fill="#2563eb" />
        <rect x="188" width="40" height="8" rx="4" fill="#fd91cc" />
      </g>
    </g>

    <!-- Row 4: Linux & Systems Hardening -->
    <g transform="translate(18, 208)">
      <text x="0" y="10" class="metric-sub">Linux &amp; Systems Defense</text>
      <text x="236" y="10" class="metric-sub" text-anchor="end" font-weight="700" fill="#38bdf8">91%</text>
      <g transform="translate(0, 16)" class="bar-anim-2">
        <rect width="236" height="8" rx="4" fill="#081738" stroke="#162e63" stroke-width="0.8" />
        <rect width="145" height="8" rx="4" fill="#fd91cc" />
        <rect x="148" width="68" height="8" rx="4" fill="#38bdf8" />
      </g>
    </g>
  </g>

  <!-- ==================== CARD 2: RADIANT PINK SPEEDOMETER GAUGE (CENTER - FLOATING) ==================== -->
  <g class="center-card-animated" transform="translate(300, 10)" filter="url(#pink-shadow)">
    <rect width="250" height="286" rx="20" fill="url(#pink-card)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3" />

    <g transform="translate(20, 20)">
      <circle cx="6" cy="6" r="4" fill="#ffffff" />
      <text x="16" y="10" class="pink-card-title">Security Posture Score</text>
      <g transform="translate(162, -3)">
        <rect width="38" height="22" rx="11" fill="#ffffff" fill-opacity="0.25" />
        <text x="19" y="15" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle" font-family="-apple-system, sans-serif">65</text>
      </g>
    </g>

    <g transform="translate(125, 172)">
      <!-- Outer Arc Dial Track -->
      <path d="M -85 0 A 85 85 0 0 1 85 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" stroke-linecap="round" />
      <!-- Glowing Active Arc (to 65) -->
      <path d="M -85 0 A 85 85 0 0 1 45 -72" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
      <!-- Inner Tick Marks -->
      <path d="M -70 0 A 70 70 0 0 1 70 0" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 6" stroke-opacity="0.45" />

      <!-- Center Big Metric Number with Respiration Pulse -->
      <g class="number-animated">
        <text x="0" y="-12" class="gauge-number">65</text>
      </g>
      <text x="0" y="12" fill="#ffffff" opacity="0.95" font-size="11" font-weight="700" text-anchor="middle" font-family="-apple-system, sans-serif" letter-spacing="0.5px">OPTIMAL RESILIENCE</text>

      <!-- Active Animated Sweeping Needle -->
      <g class="needle-element">
        <line x1="0" y1="0" x2="36" y2="-58" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
      </g>
      <circle cx="0" cy="0" r="5.5" fill="#ffffff" />
    </g>

    <g transform="translate(25, 248)">
      <rect width="200" height="24" rx="12" fill="#ffffff" fill-opacity="0.22" />
      <text x="100" y="16" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle" font-family="-apple-system, sans-serif" letter-spacing="0.5px">ZERO VULNERABILITIES FOUND</text>
    </g>
  </g>

  <!-- ==================== CARD 3: OPEN VS. RESOLVED (RIGHT - FROSTED GLASS) ==================== -->
  <g transform="translate(562, 22)" filter="url(#glass-shadow)">
    <rect width="272" height="262" rx="16" fill="url(#dark-frosted-glass)" stroke="url(#glass-border)" stroke-width="1.2" />

    <g transform="translate(18, 18)">
      <rect width="26" height="26" rx="7" fill="#2d1033" stroke="#ff4794" stroke-width="0.8" />
      <circle cx="13" cy="13" r="5" fill="#fd91cc" />
      <text x="36" y="18" class="card-heading">Open vs. Resolved</text>
    </g>

    <g transform="translate(18, 52)">
      <circle cx="4" cy="4" r="3.5" fill="#fd91cc" />
      <text x="12" y="7" class="metric-sub" font-size="9.5">Hardened Assets</text>
      <circle cx="118" cy="4" r="3.5" fill="#38bdf8" />
      <text x="126" y="7" class="metric-sub" font-size="9.5">Resolved Threats</text>
    </g>

    <!-- Sparkline Line Chart Surface -->
    <g transform="translate(18, 70)">
      <rect width="236" height="118" rx="8" fill="#061638" stroke="#162e63" stroke-width="0.8" />
      <line x1="0" y1="39" x2="236" y2="39" stroke="#162e63" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="0" y1="78" x2="236" y2="78" stroke="#162e63" stroke-dasharray="3 3" opacity="0.6" />

      <!-- Glowing Shaded Area -->
      <path d="M 10 92 Q 60 38 120 68 T 226 28 L 226 108 L 10 108 Z" fill="url(#sparkline-pink)" />
      <!-- Wave 1: Pink Hardened Assets -->
      <path d="M 10 92 Q 60 38 120 68 T 226 28" fill="none" stroke="#fd91cc" stroke-width="2.5" stroke-linecap="round" />
      <!-- Wave 2: Cyan Resolved Threats -->
      <path d="M 10 102 Q 60 76 120 42 T 226 16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

      <!-- Active Gliding Scrubber Pin Animation -->
      <g class="scrubber-animated">
        <circle cx="160" cy="46" r="5" fill="#fd91cc" stroke="#ffffff" stroke-width="2" />
        <line x1="160" y1="10" x2="160" y2="108" stroke="#fd91cc" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.8" />
        <rect x="135" y="14" width="50" height="20" rx="5" fill="#040d24" stroke="#fd91cc" stroke-width="0.8" />
        <text x="160" y="28" fill="#ffffff" font-size="9.5" font-weight="800" text-anchor="middle" font-family="-apple-system, sans-serif">98.2%</text>
      </g>
    </g>

    <!-- Bottom Flagship Platform Pill -->
    <g transform="translate(18, 206)">
      <rect width="236" height="38" rx="8" fill="url(#pill-glass)" stroke="#1d4ed8" stroke-width="1" />
      <text x="12" y="16" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#93c5fd" letter-spacing="0.5px">FLAGSHIP PLATFORM</text>
      <text x="12" y="30" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#ffffff">AutoIntel Store: Parts Ecosystem</text>
      <text x="222" y="24" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="end">→</text>
    </g>
  </g>
</svg>