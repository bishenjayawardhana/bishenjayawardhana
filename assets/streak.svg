<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="isolation:isolate" viewBox="0 0 495 195" width="495px" height="195px">
  <style>
    @keyframes stroke-pulse {
      0%, 100% { stroke-opacity: 0.9; }
      50% { stroke-opacity: 0.4; }
    }
    .ring-active {
      animation: stroke-pulse 3s ease-in-out infinite;
    }
    .stat-number {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      font-weight: 700;
      font-size: 28px;
      fill: #ffffff;
      text-anchor: middle;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      fill: #93c5fd;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
    .stat-date {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      font-weight: 400;
      font-size: 10px;
      fill: #64748b;
      text-anchor: middle;
    }
  </style>
  <defs>
    <clipPath id="_clipPath_streak">
      <rect width="495" height="195" rx="8" />
    </clipPath>
    <linearGradient id="streak-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3358" />
      <stop offset="50%" stop-color="#1e40af" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1a3358" />
    </linearGradient>
  </defs>
  <g clip-path="url(#_clipPath_streak)">
    <rect width="495" height="195" rx="8" fill="#020817" stroke="url(#streak-border)" stroke-width="1.5" />
    
    <!-- Column 1: Total Contributions -->
    <g transform="translate(82.5, 48)">
      <text x="0" y="32" class="stat-number">699</text>
      <text x="0" y="58" class="stat-label">Total Contributions</text>
      <text x="0" y="78" class="stat-date">Dec 22, 2023 - Present</text>
    </g>

    <!-- Center Ring & Flame: Current Streak -->
    <g transform="translate(247.5, 48)">
      <circle cx="0" cy="22" r="38" fill="none" stroke="#1a3358" stroke-width="4.5" />
      <circle class="ring-active" cx="0" cy="22" r="38" fill="none" stroke="#fd91cc" stroke-width="4.5" stroke-dasharray="238" stroke-dashoffset="180" stroke-linecap="round" transform="rotate(-90 0 22)" />
      
      <!-- Flame icon -->
      <path d="M -3 3 C -5 7 -6 10 -4 13 C -2 15 1 15 3 13 C 5 10 3 6 1 4 C 0 8 -2 9 -3 7 Z" fill="#fd91cc" opacity="0.8" />
      
      <text x="0" y="30" class="stat-number" fill="#fd91cc">1</text>
      <text x="0" y="76" class="stat-label">Current Streak</text>
      <text x="0" y="94" class="stat-date">Oct 30</text>
    </g>

    <!-- Column 3: Longest Streak -->
    <g transform="translate(412.5, 48)">
      <text x="0" y="32" class="stat-number">8</text>
      <text x="0" y="58" class="stat-label">Longest Streak</text>
      <text x="0" y="78" class="stat-date">Sep 12 - Sep 19</text>
    </g>

    <line x1="165" y1="35" x2="165" y2="160" stroke="#1a3358" stroke-width="1" stroke-dasharray="2 3" opacity="0.7" />
    <line x1="330" y1="35" x2="330" y2="160" stroke="#1a3358" stroke-width="1" stroke-dasharray="2 3" opacity="0.7" />
  </g>
</svg>