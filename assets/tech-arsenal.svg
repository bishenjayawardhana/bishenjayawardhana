<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="850" height="350" fill="none">
  <defs>
    <!-- Background Royal Aura -->
    <radialGradient id="arsenal-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a2561" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#041233" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020817" />
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="quad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071b42" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#030c24" stop-opacity="0.9" />
    </linearGradient>

    <!-- Outer Border -->
    <linearGradient id="outer-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fd91cc" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <style>
    .section-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.2px;
      fill: #ffffff;
    }
    .section-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.8px;
      fill: #93c5fd;
    }
    .quad-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      fill: #ffffff;
    }
    .quad-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-weight: 600;
      font-size: 9.5px;
      letter-spacing: 0.8px;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 10.5px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="848" height="348" rx="18" fill="#020817" stroke="url(#outer-border)" stroke-width="1.2" />
  <rect x="2" y="2" width="846" height="346" rx="17" fill="url(#arsenal-bg)" />

  <!-- Subtle Stardust particles -->
  <g opacity="0.45">
    <circle cx="120" cy="50" r="1" fill="#ffffff" />
    <circle cx="280" cy="35" r="1.2" fill="#fd91cc" />
    <circle cx="430" cy="45" r="1" fill="#ffffff" />
    <circle cx="620" cy="40" r="1.3" fill="#ffffff" />
    <circle cx="750" cy="60" r="1" fill="#fd91cc" />
    <circle cx="340" cy="180" r="1.2" fill="#ffffff" />
    <circle cx="520" cy="200" r="1" fill="#ffffff" />
