<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="850" height="350" fill="none">
  <defs>
    <!-- Background Royal Aura -->
    <radialGradient id="arsenal-bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0e2a6b" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#07173e" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#020817" />
    </radialGradient>

    <!-- Frosted Glass Card Surface -->
    <linearGradient id="quad-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c204d" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#040d24" stop-opacity="0.95" />
    </linearGradient>

    <!-- Card Luminous Glass Border -->
    <linearGradient id="quad-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#1d4ed8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fd91cc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Outer Container Border -->
    <linearGradient id="outer-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#1e40af" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fd91cc" stop-opacity="0.65" />
    </linearGradient>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    /* Interactive Card Float & Hover Animations */
    @keyframes subtle-float-1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes subtle-float-2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4.5px); }
    }
    .quad-interactive-1 {
      animation: subtle-float-1 5s ease-in-out infinite;
    }
    .quad-interactive-2 {
      animation: subtle-float-2 5.5s ease-in-out infinite;
    }

    @keyframes beacon-pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    .beacon-dot {
      transform-origin: center;
      animation: beacon-pulse 2.5s ease-in-out infinite;
    }

    .section-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.3px;
      fill: #ffffff;
    }
    .section-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      fill: #38bdf8;
    }
    .quad-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      fill: #ffffff;
    }
    .quad-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 9.5px;
      letter-spacing: 0.8px;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-weight: 600;
      font-size: 10.5px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Container Box -->
  <rect x="0.5" y="0.5" width="849" height="349" rx="18" fill="#020817" stroke="url(#outer-border)" stroke-width="1.2" />
  <rect x="1" y="1" width="848" height="348" rx="17" fill="url(#arsenal-bg)" />

  <!-- Stardust Particles -->
  <g opacity="0.6">
    <circle cx="120" cy="50" r="1.1" fill="#ffffff" />
    <circle cx="280" cy="35" r="1.3" fill="#fd91cc" />
    <circle cx="430" cy="45" r="1" fill="#38bdf8" />
    <circle cx="620" cy="40" r="1.4" fill="#ffffff" />
    <circle cx="750" cy="60" r="1.2" fill="#fd91cc" />
    <circle cx="340" cy="180" r="1.2" fill="#ffffff" />
    <circle cx="520" cy="200" r="1.3" fill="#38bdf8" />
  </g>

  <!-- Section Header -->
  <g transform="translate(26, 26)">
    <text x="0" y="0" class="section-sub">TECHNICAL COMPETENCIES &amp; CAPABILITIES</text>
    <text x="0" y="20" class="section-title">Engineering Arsenal &amp; Tooling</text>
  </g>

  <!-- ==================== QUADRANT 1: CYBER SECURITY ==================== -->
  <g class="quad-interactive-1" transform="translate(20, 68)" filter="url(#card-shadow)">
    <rect width="395" height="125" rx="14" fill="url(#quad-glass)" stroke="url(#quad-border)" stroke-width="1.2" />
    
    <g transform="translate(16, 14)">
      <rect width="24" height="24" rx="7" fill="#2d1033" stroke="#ff4794" stroke-width="0.8" />
      <path d="M12 6 L17 8.5 V13 C17 16 12 18 12 18 C12 18 7 16 7 13 V8.5 Z" fill="none" stroke="#fd91cc" stroke-width="1.5" stroke-linejoin="round" />
      <text x="32" y="10" fill="#fd91cc" class="quad-sub">SYSTEMS DEFENSE</text>
      <text x="32" y="24" class="quad-title">Offensive &amp; Defensive Security</text>
    </g>

    <g transform="translate(16, 56)">
      <g transform="translate(0, 0)">
        <rect width="105" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#fd91cc" />
        <text x="16" y="15" class="pill-label">OWASP Top 10</text>
      </g>
      <g transform="translate(112, 0)">
        <rect width="115" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#fd91cc" />
        <text x="16" y="15" class="pill-label">Network Defense</text>
      </g>
      <g transform="translate(234, 0)">
        <rect width="125" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#fd91cc" />
        <text x="16" y="15" class="pill-label">Penetration Testing</text>
      </g>
    </g>

    <g transform="translate(16, 86)">
      <g transform="translate(0, 0)">
        <rect width="80" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Wireshark</text>
      </g>
      <g transform="translate(86, 0)">
        <rect width="60" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Nmap</text>
      </g>
      <g transform="translate(152, 0)">
        <rect width="82" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Kali Linux</text>
      </g>
      <g transform="translate(240, 0)">
        <rect width="119" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Python / Bash</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 2: FRONTEND ==================== -->
  <g class="quad-interactive-2" transform="translate(435, 68)" filter="url(#card-shadow)">
    <rect width="395" height="125" rx="14" fill="url(#quad-glass)" stroke="url(#quad-border)" stroke-width="1.2" />

    <g transform="translate(16, 14)">
      <rect width="24" height="24" rx="7" fill="#0c2357" stroke="#1d4ed8" stroke-width="0.8" />
      <path d="M9 7 L5 12 L9 17 M15 7 L19 12 L15 17" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <text x="32" y="10" fill="#38bdf8" class="quad-sub">MODERN CLIENT SYSTEMS</text>
      <text x="32" y="24" class="quad-title">Frontend Architecture</text>
    </g>

    <g transform="translate(16, 56)">
      <g transform="translate(0, 0)">
        <rect width="80" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#38bdf8" />
        <text x="16" y="15" class="pill-label">React 18</text>
      </g>
      <g transform="translate(86, 0)">
        <rect width="85" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#38bdf8" />
        <text x="16" y="15" class="pill-label">Next.js 14</text>
      </g>
      <g transform="translate(178, 0)">
        <rect width="88" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#38bdf8" />
        <text x="16" y="15" class="pill-label">TypeScript</text>
      </g>
      <g transform="translate(272, 0)">
        <rect width="90" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#38bdf8" />
        <text x="16" y="15" class="pill-label">JavaScript</text>
      </g>
    </g>

    <g transform="translate(16, 86)">
      <g transform="translate(0, 0)">
        <rect width="98" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Tailwind CSS</text>
      </g>
      <g transform="translate(104, 0)">
        <rect width="105" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">HTML5 / Web APIs</text>
      </g>
      <g transform="translate(215, 0)">
        <rect width="147" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Responsive UI / UX</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 3: BACKEND ==================== -->
  <g class="quad-interactive-2" transform="translate(20, 205)" filter="url(#card-shadow)">
    <rect width="395" height="125" rx="14" fill="url(#quad-glass)" stroke="url(#quad-border)" stroke-width="1.2" />

    <g transform="translate(16, 14)">
      <rect width="24" height="24" rx="7" fill="#0c2357" stroke="#1d4ed8" stroke-width="0.8" />
      <path d="M5 8 H19 M5 12 H19 M5 16 H19" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <text x="32" y="10" fill="#38bdf8" class="quad-sub">SERVER ARCHITECTURE</text>
      <text x="32" y="24" class="quad-title">Backend &amp; Distributed Systems</text>
    </g>

    <g transform="translate(16, 56)">
      <g transform="translate(0, 0)">
        <rect width="78" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#38bdf8" />
        <text x="16" y="15" class="pill-label">Node.js</text>
      </g>
      <g transform="translate(84, 0)">
        <rect width="80" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#38bdf8" />
        <text x="16" y="15" class="pill-label">Express</text>
      </g>
      <g transform="translate(170, 0)">
        <rect width="95" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#38bdf8" />
        <text x="16" y="15" class="pill-label">RESTful APIs</text>
      </g>
      <g transform="translate(271, 0)">
        <rect width="90" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#38bdf8" />
        <text x="16" y="15" class="pill-label">JWT / OAuth</text>
      </g>
    </g>

    <g transform="translate(16, 86)">
      <g transform="translate(0, 0)">
        <rect width="112" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Microservices</text>
      </g>
      <g transform="translate(118, 0)">
        <rect width="110" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Rate Limiting</text>
      </g>
      <g transform="translate(234, 0)">
        <rect width="128" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">API Optimization</text>
      </g>
    </g>
  </g>

  <!-- ==================== QUADRANT 4: DEVOPS & DATABASES ==================== -->
  <g class="quad-interactive-1" transform="translate(435, 205)" filter="url(#card-shadow)">
    <rect width="395" height="125" rx="14" fill="url(#quad-glass)" stroke="url(#quad-border)" stroke-width="1.2" />

    <g transform="translate(16, 14)">
      <rect width="24" height="24" rx="7" fill="#2d1033" stroke="#ff4794" stroke-width="0.8" />
      <path d="M5 8 C5 6 12 5 12 5 C12 5 19 6 19 8 V16 C19 18 12 19 12 19 C12 19 5 18 5 16 Z" fill="none" stroke="#fd91cc" stroke-width="1.5" />
      <text x="32" y="10" fill="#fd91cc" class="quad-sub">INFRASTRUCTURE &amp; DATA</text>
      <text x="32" y="24" class="quad-title">DevOps, Cloud &amp; Persistence</text>
    </g>

    <g transform="translate(16, 56)">
      <g transform="translate(0, 0)">
        <rect width="70" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#fd91cc" />
        <text x="16" y="15" class="pill-label">Docker</text>
      </g>
      <g transform="translate(76, 0)">
        <rect width="52" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#fd91cc" />
        <text x="16" y="15" class="pill-label">Git</text>
      </g>
      <g transform="translate(134, 0)">
        <rect width="112" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#fd91cc" />
        <text x="16" y="15" class="pill-label">GitHub Actions</text>
      </g>
      <g transform="translate(252, 0)">
        <rect width="72" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.9" />
        <circle class="beacon-dot" cx="9" cy="11" r="2.5" fill="#fd91cc" />
        <text x="16" y="15" class="pill-label">MySQL</text>
      </g>
    </g>

    <g transform="translate(16, 86)">
      <g transform="translate(0, 0)">
        <rect width="90" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">PostgreSQL</text>
      </g>
      <g transform="translate(96, 0)">
        <rect width="72" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Postman</text>
      </g>
      <g transform="translate(174, 0)">
        <rect width="84" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Linux CLI</text>
      </g>
      <g transform="translate(264, 0)">
        <rect width="96" height="22" rx="6" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">CI/CD Pipelines</text>
      </g>
    </g>
  </g>
</svg>