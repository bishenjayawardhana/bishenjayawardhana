      <g transform="translate(0, 0)">
        <rect width="105" height="22" rx="5" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <circle cx="9" cy="11" r="2.5" fill="#fd91cc" />
        <text x="16" y="15" class="pill-label">OWASP Top 10</text>
      </g>
      <g transform="translate(112, 0)">
        <rect width="115" height="22" rx="5" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <circle cx="9" cy="11" r="2.5" fill="#fd91cc" />
        <text x="16" y="15" class="pill-label">Network Defense</text>
      </g>
