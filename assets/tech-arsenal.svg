      <path d="M11 5 L16 7.5 V12 C16 15 11 17 11 17 C11 17 6 15 6 12 V7.5 Z" fill="none" stroke="#fd91cc" stroke-width="1.4" stroke-linejoin="round" />
      <text x="30" y="10" fill="#fd91cc" class="quad-sub">SYSTEMS DEFENSE</text>
      <text x="30" y="24" class="quad-title">Offensive &amp; Defensive Security</text>
    </g>

