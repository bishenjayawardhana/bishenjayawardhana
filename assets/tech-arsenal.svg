      <g transform="translate(118, 0)">
        <rect width="75" height="22" rx="5" fill="#030c24" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="10" y="15" class="pill-label" fill="#93c5fd">Postman</text>
